name: Build Frontend Assets

on:
  push:
    branches: [master]
    paths:
      - 'resources/css/**'
      - 'resources/js/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [master]
    paths:
      - 'resources/css/**'
      - 'resources/js/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  dist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Fail if committed dist is stale
        run: git diff --exit-code resources/dist/
